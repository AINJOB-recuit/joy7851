# MySQL 프로필 (Docker Compose / 로컬 MySQL)
# 실행: mvn spring-boot:run -Dspring-boot.run.profiles=mysql

spring.datasource.url=jdbc:mysql://localhost:3307/ainjob?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=ainjob
spring.datasource.password=ainjob
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Docker init 으로 schema/seed 적용 → 앱에서는 끄기
spring.sql.init.mode=never
spring.h2.console.enabled=false

# ---- SMTP (기본: Docker Mailpit) ----
ainjob.mail.enabled=true
ainjob.mail.from=noreply@ainjob.local
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

