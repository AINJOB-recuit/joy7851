spring.application.name=ainjob-ats

# 기본: H2 (단위/통합 테스트용). MySQL 사용 시: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:ainjob;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# SMTP — 기본 off (테스트). mysql 프로필에서 Mailpit/실SMTP 활성화
ainjob.mail.enabled=false
ainjob.mail.from=noreply@ainjob.local
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

logging.level.com.ainjob=INFO
